<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; script-src 'self'" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f6efe4" />
  <meta name="mobile-web-app-capable" content="yes" />
  <link rel="manifest" href="manifest.webmanifest" />
  <title>知微 · Subtext</title>
  <link rel="stylesheet" href="css/tokens.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/effects.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/views.css" />
  <link rel="stylesheet" href="css/mobile.css" />
</head>
<body>
  <div class="bg-fx" aria-hidden="true">
    <div class="bg-grid"></div>
    <div class="bg-glow"></div>
    <div class="bg-noise"></div>
  </div>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-mark">
          <svg viewBox="0 0 32 32" width="30" height="30" aria-hidden="true">
            <defs>
              <linearGradient id="bm" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#6b5a9e"/><stop offset="1" stop-color="#8a5a2b"/>
              </linearGradient>
            </defs>
            <path d="M16 3 C9 9 6 14 6 19 a10 10 0 0 0 20 0 C26 14 23 9 16 3 Z" fill="none" stroke="url(#bm)" stroke-width="2.4"/>
            <path d="M16 12 C13 15 11.5 17.5 11.5 20 a4.5 4.5 0 0 0 9 0 C20.5 17.5 19 15 16 12 Z" fill="url(#bm)" opacity="0.85"/>
          </svg>
        </div>
        <div class="brand-text">
          <div class="brand-name">知微</div>
          <div class="brand-sub">Subtext</div>
        </div>
      </div>
      <nav class="nav" id="nav"></nav>
      <div class="sidebar-foot">
        <div class="person-chip" id="personChip" hidden>
          <span class="dot"></span><span class="person-chip-name"></span>
        </div>
        <div class="mode-chip" id="modeChip">演示模式</div>
      </div>
    </aside>
    <main class="main" id="main"></main>
  </div>
  <div class="modal-backdrop" id="modalBackdrop" hidden>
    <div class="modal" id="modal"></div>
  </div>
  <div class="toasts" id="toasts" aria-live="polite"></div>
  <div class="loading-overlay" id="loading" hidden>
    <div class="loading-box" role="status" aria-live="polite">
      <div class="spinner" aria-hidden="true"></div>
      <div class="loading-text" id="loadingText">处理中…</div>
    </div>
  </div>
  <script src="js/constants.js"></script>
  <script src="js/dom.js"></script>
  <script src="js/api.js"></script>
  <script src="js/state.js"></script>
  <script src="js/hud.js"></script>
  <script src="js/views/home.js"></script>
  <script src="js/views/card.js"></script>
  <script src="js/views/evidence.js"></script>
  <script src="js/views/import.js"></script>
  <script src="js/views/interview.js"></script>
  <script src="js/views/rehearsal.js"></script>
  <script src="js/views/calibration.js"></script>
  <script src="js/views/analysis.js"></script>
  <script src="js/views/settings.js"></script>
  <script src="js/router.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
